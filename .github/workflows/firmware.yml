name: Kds — firmware amont et validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  firmware:
    name: Build official KodeOS P4 and C5 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kds
        uses: actions/checkout@v4

      - name: Checkout official KodeOS and all upstream submodules
        uses: actions/checkout@v4
        with:
          repository: kodediy/KodeOS
          ref: 9bcfdb71b763ee7b5c14106358643ea611fc97db
          path: upstream/KodeOS
          submodules: recursive
          fetch-depth: 1

      - name: Verify upstream source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream/KodeOS rev-parse HEAD)" = "9bcfdb71b763ee7b5c14106358643ea611fc97db"
          test "$(git -C upstream/KodeOS/sdk rev-parse HEAD)" = "1841cc8c13d4b2e3e4d7288b40cdac5de207a133"
          git -C upstream/KodeOS submodule status --recursive
          echo "KodeOS and SDK source pins verified."

      - name: Build official ESP32-C5 firmware
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5
        with:
          path: upstream/KodeOS
          esp_idf_version: v6.1
          target: esp32c5
          command: bash tools/build_c5.sh

      - name: Merge C5 flash image
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/esptool-tools
          /tmp/esptool-tools/bin/pip install --disable-pip-version-check esptool
          cd upstream/KodeOS/build_c5
          /tmp/esptool-tools/bin/python -m esptool --chip esp32c5 merge-bin -o "$GITHUB_WORKSPACE/c5-flash.bin" -f raw @flash_args
          test -s "$GITHUB_WORKSPACE/c5-flash.bin"

      - name: Build official ESP32-P4 KodeOS firmware and storage image
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5
        with:
          path: upstream/KodeOS
          esp_idf_version: v6.1
          target: esp32p4
          command: idf.py build

      - name: Merge P4 flash image with storage partition
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/KodeOS/build
          /tmp/esptool-tools/bin/python -m esptool --chip esp32p4 merge-bin -o "$GITHUB_WORKSPACE/p4-kodeos-flash.bin" -f raw @flash_args 0x1800000 storage.bin
          test -s "$GITHUB_WORKSPACE/p4-kodeos-flash.bin"
          test -s kodeos.bin
          test -s storage.bin

      - name: Package complete upstream source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude-vcs -czf "$GITHUB_WORKSPACE/kodediy-upstream-source.tar.gz" -C upstream KodeOS
          test -s "$GITHUB_WORKSPACE/kodediy-upstream-source.tar.gz"

      - name: Write reproducible source manifest
        shell: bash
        run: |
          cat > source-manifest.json <<'EOF'
          {
            "kodeos_repository": "https://github.com/kodediy/KodeOS",
            "kodeos_commit": "9bcfdb71b763ee7b5c14106358643ea611fc97db",
            "sdk_repository": "https://github.com/kodediy/kode-sdk",
            "sdk_commit": "1841cc8c13d4b2e3e4d7288b40cdac5de207a133",
            "esp_idf": "v6.1",
            "targets": ["esp32p4", "esp32c5"],
            "display": "410x502 RGB565",
            "upstream_source_archive": "kodediy-upstream-source.tar.gz",
            "note": "Firmware build artifacts only; this does not claim that the complete Kode Dot peripheral set is emulated."
          }
          EOF
          sha256sum p4-kodeos-flash.bin c5-flash.bin kodediy-upstream-source.tar.gz > SHA256SUMS

      - name: Upload upstream source, firmware and manifest
        uses: actions/upload-artifact@v4
        with:
          name: kds-upstream-and-firmware
          path: |
            kodediy-upstream-source.tar.gz
            p4-kodeos-flash.bin
            c5-flash.bin
            source-manifest.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  windows-kgui:
    name: Build the real KodeOS KGUI on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Kds
        uses: actions/checkout@v4

      - name: Checkout official KodeOS and SDK sources
        uses: actions/checkout@v4
        with:
          repository: kodediy/KodeOS
          ref: 9bcfdb71b763ee7b5c14106358643ea611fc97db
          path: upstream/KodeOS
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSYS2 UCRT64 with SDL2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-python

      - name: Build official KGUI simulator for Windows
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # The upstream simulator's source list omits the KGUI edge module,
          # although kgui_off.h includes its public header.
          python - <<'PY'
          from pathlib import Path
          p = Path("upstream/KodeOS/components/kgui/sim/CMakeLists.txt")
          s = p.read_text()
          s = s.replace(
              "SOURCES ${CMAKE_CURRENT_LIST_DIR}/kgui_sim.c ${KGUI_SCREENS}",
              "SOURCES ${CMAKE_CURRENT_LIST_DIR}/kgui_sim.c ${CMAKE_CURRENT_LIST_DIR}/../kgui_edge.c ${CMAKE_CURRENT_LIST_DIR}/../kgui_fluid.c ${KGUI_SCREENS}"
          )
          s = s.replace(
              "INCLUDES ${CMAKE_CURRENT_LIST_DIR}/../screens)",
              "INCLUDES ${CMAKE_CURRENT_LIST_DIR}/../screens ${CMAKE_CURRENT_LIST_DIR}/.. ${CMAKE_CURRENT_LIST_DIR}/../include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kode_sys/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kdefs/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/klog/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kdrv/apps/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kdrv/motion/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kdrv/nfc/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kdrv/radio/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kdrv/storage/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kaos/core/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kqp/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/khal/sync/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/qpc/qpc/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/qpc/port ${CMAKE_CURRENT_LIST_DIR}/../../../../../kds-freertos-headers)"
          )
          # Include the real KGUI font and glyph translation units referenced by screens.
          s = s.replace(
              "file(GLOB KGUI_SCREENS",
              "file(GLOB_RECURSE KGUI_ASSETS ${CMAKE_CURRENT_LIST_DIR}/../fonts/*.c ${CMAKE_CURRENT_LIST_DIR}/../glyphs/*.c)\nfile(GLOB KGUI_SCREENS"
          )
          s = s.replace(
              "${CMAKE_CURRENT_LIST_DIR}/kgui_sim.c ${CMAKE_CURRENT_LIST_DIR}/../kgui_edge.c ${CMAKE_CURRENT_LIST_DIR}/../kgui_fluid.c ${KGUI_SCREENS}",
              "${CMAKE_CURRENT_LIST_DIR}/kgui_sim.c ${CMAKE_CURRENT_LIST_DIR}/../kgui_edge.c ${CMAKE_CURRENT_LIST_DIR}/../kgui_fluid.c ${KGUI_ASSETS} ${KGUI_SCREENS} ${CMAKE_CURRENT_LIST_DIR}/../../../../../native/kgui_sim_hal.c ${CMAKE_CURRENT_LIST_DIR}/../../../../../native/kds_storage.c"
          )
          p.write_text(s)
          # Wire the host SD directory into the actual simulator startup.
          main = Path("upstream/KodeOS/sdk/components/kui/sim/main.c")
          ms = main.read_text()
          ms = ms.replace('#include "keys.h"', '#include "keys.h"' + chr(10) + '#include "kds_storage.h"' + chr(10) + '#include "kgui_screens.h"' + chr(10) + '#include <time.h>')
          # Expose a narrow setter for the face's existing date label.
          face = Path("upstream/KodeOS/components/kgui/screens/kgui_screen_face.c")
          fs = face.read_text(encoding="utf-8")
          date_anchor = ("void kgui_screen_face_date(bool shown)" + chr(10)
                         + "{" + chr(10)
                         + "    s_date_wanted = shown;" + chr(10)
                         + "    if ( NULL != s_date_line )" + chr(10)
                         + "    {" + chr(10)
                         + "        lv_obj_set_hidden(s_date_line, (!shown) || s_bare || s_arc_up || s_knock_up);" + chr(10)
                         + "    }" + chr(10)
                         + "}" + chr(10))
          date_setter = date_anchor + (chr(10)
                         + "void kgui_screen_face_date_text(const char *text)" + chr(10)
                         + "{" + chr(10)
                         + "    if ((NULL != s_date_line) && (NULL != text)) {" + chr(10)
                         + "        lv_label_set_text(s_date_line, text);" + chr(10)
                         + "        kgui_screen_face_date_place();" + chr(10)
                         + "    }" + chr(10)
                         + "}" + chr(10))
          if date_anchor not in fs:
              raise SystemExit("Could not locate the official KGUI face date function")
          fs = fs.replace(date_anchor, date_setter, 1)
          face.write_text(fs, encoding="utf-8")
          header = Path("upstream/KodeOS/components/kgui/screens/kgui_screens.h")
          hs = header.read_text(encoding="utf-8")
          header_anchor = "void kgui_screen_face_date(bool shown);"
          if header_anchor not in hs:
              raise SystemExit("Could not locate the official KGUI face date declaration")
          hs = hs.replace(header_anchor, header_anchor + chr(10) + "void kgui_screen_face_date_text(const char *text);", 1)
          header.write_text(hs, encoding="utf-8")
          # Drive the official KGUI face clock and date from host local time.
          clock_code = '''
          static void kds_host_clock_tick(lv_timer_t *timer)
          {
              static const char *const weekdays[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
              static const char *const months[] = {"Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"};
              char date_text[24];
              (void)timer;
              time_t now = time(NULL);
              struct tm *local = localtime(&now);
              if (local != NULL) {
                  kgui_screen_face_time(local->tm_hour, local->tm_min, false, false);
                  if ((local->tm_wday >= 0) && (local->tm_wday < 7) &&
                      (local->tm_mon >= 0) && (local->tm_mon < 12)) {
                      (void)snprintf(date_text, sizeof(date_text), "%s %d %s",
                                     weekdays[local->tm_wday], local->tm_mday,
                                     months[local->tm_mon]);
                      kgui_screen_face_date_text(date_text);
                  }
              }
          }
          '''
          ms = ms.replace('/** The most --set options one run takes. */', clock_code + chr(10) + '/** The most --set options one run takes. */')
          ms = ms.replace('    lv_screen_load(scr);', '    lv_screen_load(scr);' + chr(10) + '    if (strcmp(o.screen, "face") == 0) {' + chr(10) + '        (void)lv_timer_create(kds_host_clock_tick, 1000U, NULL);' + chr(10) + '    }')
          boot = '    if (kds_storage_init() == 0) {' + chr(10)
          boot += '        fprintf(stderr, "Kds SD: %s' + chr(92) + 'n", kds_storage_root());' + chr(10)
          boot += '    } else {' + chr(10)
          boot += '        fprintf(stderr, "Kds SD unavailable; continuing without persistent storage.' + chr(92) + 'n");' + chr(10)
          boot += '    }' + chr(10) + '    lv_init();'
          ms = ms.replace('    lv_init();', boot)
          main.write_text(ms)
          PY
          # KGUI screen headers include KodeOS QP/C declarations. The Windows
          # visual simulator does not run QP/FreeRTOS; provide type-only
          # FreeRTOS declarations so those headers parse without pretending
          # that an RTOS is running.
          mkdir -p kds-freertos-headers/freertos
          # Minimal Kconfig values for parsing KQP headers in the visual-only build.
          # Scheduler and factory-test AOs are not started by the native KGUI simulator.
          cat > kds-freertos-headers/sdkconfig.h <<'EOF'
          #pragma once
          #define CONFIG_KODE_SCHEDULER 0
          #define CONFIG_KODE_TEST_DOT 0
          EOF
          cat > kds-freertos-headers/freertos/FreeRTOS.h <<'EOF'
          #pragma once
          #include <stdint.h>
          #include <stddef.h>
          typedef void * QueueHandle_t;
          typedef void * TaskHandle_t;
          typedef int BaseType_t;
          typedef unsigned UBaseType_t;
          typedef uint32_t TickType_t;
          typedef uint32_t StackType_t;
          typedef struct { unsigned char opaque[128]; } StaticQueue_t;
          typedef struct { unsigned char opaque[256]; } StaticTask_t;
          typedef struct { unsigned opaque[8]; } portMUX_TYPE;
          #define configUSE_IDLE_HOOK 0
          #define configUSE_TICK_HOOK 0
          #define configCHECK_FOR_STACK_OVERFLOW 0
          #define configSUPPORT_STATIC_ALLOCATION 0
          #define tskIDLE_PRIORITY 0
          EOF
          cat > kds-freertos-headers/freertos/task.h <<'EOF'
          #pragma once
          #include "FreeRTOS.h"
          #define taskDISABLE_INTERRUPTS() ((void)0)
          #define taskENABLE_INTERRUPTS() ((void)0)
          #define taskENTER_CRITICAL(mux) ((void)(mux))
          #define taskEXIT_CRITICAL(mux) ((void)(mux))
          #define taskENTER_CRITICAL_FROM_ISR() (0U)
          #define taskEXIT_CRITICAL_FROM_ISR(x) ((void)(x))
          static inline void vTaskSuspendAll(void) {}
          static inline BaseType_t xTaskResumeAll(void) { return 1; }
          EOF
          cat > kds-freertos-headers/freertos/queue.h <<'EOF'
          #pragma once
          #include "FreeRTOS.h"
          EOF
          # MinGW's Windows CRT does not expose POSIX setenv(); provide a tiny
          # compatibility shim without changing the official SDK source.
          cat > kds-win-compat.h <<'EOF'
          #include <stdlib.h>
          #ifdef _WIN32
          static inline int kds_setenv(const char *name, const char *value, int overwrite)
          {
              if (!overwrite && getenv(name) != NULL) return 0;
              return _putenv_s(name, value);
          }
          #define setenv kds_setenv
          #endif
          EOF
          cmake -S upstream/KodeOS/components/kgui/sim -B build-kgui -G Ninja \
            -DCMAKE_C_FLAGS="-include $GITHUB_WORKSPACE/kds-win-compat.h -I$GITHUB_WORKSPACE/native"
          cmake --build build-kgui --parallel

      - name: Build and test persistent SD storage foundation
        shell: msys2 {0}
        run: |
          set -euo pipefail
          gcc -std=c11 -Wall -Wextra -Werror -I native native/kds_storage.c native/test_storage.c -o kds-storage-test.exe
          ./kds-storage-test.exe
          test -f "$APPDATA/Kds/SD/kds-storage-test.txt"

      - name: Smoke-test real KGUI screen rendering
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # GitHub-hosted Windows runners have no interactive display. Use
          # SDL's dummy video backend and its software renderer for snapshots.
          export SDL_VIDEODRIVER=dummy
          export SDL_RENDER_DRIVER=software
          for screen in face launcher loading settings touch_test; do
            echo "Smoke-test KGUI screen: $screen"
            ./build-kgui/kgui_sim.exe "$screen" --snapshot "kds-$screen.png" --device --bezel
            test -s "kds-$screen.png"
          done

      - name: Package Windows KGUI simulator
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p kds-kgui-windows
          cp build-kgui/kgui_sim.exe kds-kgui-windows/
          cp /ucrt64/bin/SDL2.dll kds-kgui-windows/
          cp kds-*.png kds-kgui-windows/
          cp native/kds_storage.h native/kds_storage.c kds-kgui-windows/
          cat > kds-kgui-windows/Kds-Start.bat <<'EOF'
          @echo off
          cd /d "%~dp0"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Kds-Start.ps1"
          EOF
          cat > kds-kgui-windows/Kds-Start.ps1 <<'EOF'
          Add-Type -AssemblyName System.Windows.Forms
          Add-Type -AssemblyName System.Drawing
          # Do not open another KGUI window while one is already running.
          $running = Get-Process -Name "kgui_sim" -ErrorAction SilentlyContinue
          if ($null -ne $running) {
            [Windows.Forms.MessageBox]::Show(
              "Le simulateur Kds est deja ouvert. Utilisez la fenetre existante.",
              "Kds - deja lance",
              [Windows.Forms.MessageBoxButtons]::OK,
              [Windows.Forms.MessageBoxIcon]::Information
            ) | Out-Null
            exit 0
          }
          $form = New-Object Windows.Forms.Form
          $form.Text = "Kds - Kode Dot"
          $form.StartPosition = "CenterScreen"
          $form.Size = New-Object Drawing.Size(430,430)
          $form.FormBorderStyle = "FixedDialog"
          $form.MaximizeBox = $false
          $form.BackColor = [Drawing.Color]::FromArgb(22,24,30)
          $form.ForeColor = [Drawing.Color]::White
          $header = New-Object Windows.Forms.Label
          $header.Text = "Kds | Kode Dot - Simulateur natif KGUI"
          $header.Font = New-Object Drawing.Font("Segoe UI",16,[Drawing.FontStyle]::Bold)
          $header.TextAlign = "MiddleCenter"
          $header.Location = New-Object Drawing.Point(20,15)
          $header.Size = New-Object Drawing.Size(370,65)
          $form.Controls.Add($header)
          $items = @(@("Visage / cadran","face"),@("Lanceur d'applications","launcher"),@("Ecran de chargement","loading"),@("Parametres","settings"),@("Test tactile","touch_test"))
          $y = 95
          foreach ($item in $items) {
            $button = New-Object Windows.Forms.Button
            $button.Text = $item[0]
            $button.Tag = $item[1]
            $button.Location = New-Object Drawing.Point(55,$y)
            $button.Size = New-Object Drawing.Size(300,42)
            $button.FlatStyle = "Flat"
            $button.BackColor = [Drawing.Color]::FromArgb(54,66,92)
            $button.ForeColor = [Drawing.Color]::White
            $button.Font = New-Object Drawing.Font("Segoe UI",10,[Drawing.FontStyle]::Bold)
            $button.Add_Click({
              $screen = [string]$this.Tag
              $exe = Join-Path $PSScriptRoot "kgui_sim.exe"
              if (-not (Test-Path -LiteralPath $exe)) {
                [Windows.Forms.MessageBox]::Show("kgui_sim.exe est introuvable.", "Kds - erreur") | Out-Null
                return
              }
              try {
                Start-Process -FilePath $exe -ArgumentList @($screen,"--device","--bezel") -WorkingDirectory $PSScriptRoot -ErrorAction Stop | Out-Null
                $form.Close()
              } catch {
                [Windows.Forms.MessageBox]::Show($_.Exception.Message, "Kds - lancement impossible") | Out-Null
              }
            })
            $form.Controls.Add($button)
            $y += 49
          }
          [void]$form.ShowDialog()
          EOF
          cat > kds-kgui-windows/README.txt <<'EOF'
          Kds - Kode Dot : previsualisation native Windows
          =================================================
          Demarrage : double-cliquez sur Kds-Start.bat.
          Choisissez un ecran dans le menu. L'option 6 ouvre le cadran.
          
          Commandes dans la fenetre du simulateur :
            Fleches haut/bas/gauche/droite : naviguer dans le focus
            Entree : bouton TOP (valider)
            Echap : bouton BOT (retour)
            Souris : toucher l'ecran et appuyer sur les boutons du boitier
          
          Un seul processus KGUI est autorise a la fois. Relancez Kds-Start
          apres avoir ferme la fenetre du simulateur pour choisir un autre ecran.
          
          Ecrans fournis : face, launcher, loading, settings, touch_test.
          L'interface est le vrai KGUI KodeOS compile avec LVGL et SDL2.
          Ce mode natif ne simule pas le processeur ESP32-P4 ni tous les
          services firmware (capteurs, Active Objects, animations Kody).
          Les applications firmware ESP32 ne sont pas executables directement
          dans ce mode ; elles demandent un portage natif de leur code source.
          Internet n'est pas necessaire apres extraction de l'archive.
          =================================================
          EOF
      - name: Upload Windows KGUI preview
        uses: actions/upload-artifact@v4
        with:
          name: kds-kgui-windows-preview
          path: kds-kgui-windows/
          if-no-files-found: error
          retention-days: 14

  publish-windows-download:
    name: Publish direct Windows download
    needs: windows-kgui
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: kds-kgui-windows-preview
          path: package
      - name: Create or update public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cd package
          zip -9 -r ../kds-windows-preview.zip .
          cd ..
          if ! gh release view windows-preview >/dev/null 2>&1; then
            gh release create windows-preview --title "Kds Windows preview" --notes "Windows native KGUI preview built from the pinned official KodeOS/SDK sources. This is a native KGUI screen simulator, not a complete ESP32-P4 firmware emulator."
          fi
          gh release upload windows-preview kds-windows-preview.zip --clobber
          echo "Direct download: https://github.com/${GITHUB_REPOSITORY}/releases/download/windows-preview/kds-windows-preview.zip"
