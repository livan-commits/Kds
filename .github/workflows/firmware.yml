name: Kds — firmware amont et validation

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: Build official KodeOS P4 and C5 firmware
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Kds
        uses: actions/checkout@v4

      - name: Checkout official KodeOS and all upstream submodules
        uses: actions/checkout@v4
        with:
          repository: kodediy/KodeOS
          ref: 9bcfdb71b763ee7b5c14106358643ea611fc97db
          path: upstream/KodeOS
          submodules: recursive
          fetch-depth: 1

      - name: Verify upstream source pins
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C upstream/KodeOS rev-parse HEAD)" = "9bcfdb71b763ee7b5c14106358643ea611fc97db"
          test "$(git -C upstream/KodeOS/sdk rev-parse HEAD)" = "1841cc8c13d4b2e3e4d7288b40cdac5de207a133"
          git -C upstream/KodeOS submodule status --recursive
          echo "KodeOS and SDK source pins verified."

      - name: Build official ESP32-C5 firmware
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5
        with:
          path: upstream/KodeOS
          esp_idf_version: v6.1
          target: esp32c5
          command: bash tools/build_c5.sh

      - name: Merge C5 flash image
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/esptool-tools
          /tmp/esptool-tools/bin/pip install --disable-pip-version-check esptool
          cd upstream/KodeOS/build_c5
          /tmp/esptool-tools/bin/python -m esptool --chip esp32c5 merge-bin -o "$GITHUB_WORKSPACE/c5-flash.bin" -f raw @flash_args
          test -s "$GITHUB_WORKSPACE/c5-flash.bin"

      - name: Build official ESP32-P4 KodeOS firmware and storage image
        uses: espressif/esp-idf-ci-action@e6f5c74232b1ccd4c97ed641f1e48553853f1fd5
        with:
          path: upstream/KodeOS
          esp_idf_version: v6.1
          target: esp32p4
          command: idf.py build

      - name: Merge P4 flash image with storage partition
        shell: bash
        run: |
          set -euo pipefail
          cd upstream/KodeOS/build
          /tmp/esptool-tools/bin/python -m esptool --chip esp32p4 merge-bin -o "$GITHUB_WORKSPACE/p4-kodeos-flash.bin" -f raw @flash_args 0x1800000 storage.bin
          test -s "$GITHUB_WORKSPACE/p4-kodeos-flash.bin"
          test -s kodeos.bin
          test -s storage.bin

      - name: Package complete upstream source tree
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude-vcs -czf "$GITHUB_WORKSPACE/kodediy-upstream-source.tar.gz" -C upstream KodeOS
          test -s "$GITHUB_WORKSPACE/kodediy-upstream-source.tar.gz"

      - name: Write reproducible source manifest
        shell: bash
        run: |
          cat > source-manifest.json <<'EOF'
          {
            "kodeos_repository": "https://github.com/kodediy/KodeOS",
            "kodeos_commit": "9bcfdb71b763ee7b5c14106358643ea611fc97db",
            "sdk_repository": "https://github.com/kodediy/kode-sdk",
            "sdk_commit": "1841cc8c13d4b2e3e4d7288b40cdac5de207a133",
            "esp_idf": "v6.1",
            "targets": ["esp32p4", "esp32c5"],
            "display": "410x502 RGB565",
            "upstream_source_archive": "kodediy-upstream-source.tar.gz",
            "note": "Firmware build artifacts only; this does not claim that the complete Kode Dot peripheral set is emulated."
          }
          EOF
          sha256sum p4-kodeos-flash.bin c5-flash.bin kodediy-upstream-source.tar.gz > SHA256SUMS

      - name: Upload upstream source, firmware and manifest
        uses: actions/upload-artifact@v4
        with:
          name: kds-upstream-and-firmware
          path: |
            kodediy-upstream-source.tar.gz
            p4-kodeos-flash.bin
            c5-flash.bin
            source-manifest.json
            SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  windows-kgui:
    name: Build the real KodeOS KGUI on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout Kds
        uses: actions/checkout@v4

      - name: Checkout official KodeOS and SDK sources
        uses: actions/checkout@v4
        with:
          repository: kodediy/KodeOS
          ref: 9bcfdb71b763ee7b5c14106358643ea611fc97db
          path: upstream/KodeOS
          submodules: recursive
          fetch-depth: 1

      - name: Set up MSYS2 UCRT64 with SDL2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-SDL2
            mingw-w64-ucrt-x86_64-python

      - name: Build official KGUI simulator for Windows
        shell: msys2 {0}
        run: |
          set -euo pipefail
          # The upstream simulator's source list omits the KGUI edge module,
          # although kgui_off.h includes its public header.
          python - <<'PY'
          from pathlib import Path
          p = Path("upstream/KodeOS/components/kgui/sim/CMakeLists.txt")
          s = p.read_text()
          s = s.replace(
              "SOURCES ${CMAKE_CURRENT_LIST_DIR}/kgui_sim.c ${KGUI_SCREENS}",
              "SOURCES ${CMAKE_CURRENT_LIST_DIR}/kgui_sim.c ${CMAKE_CURRENT_LIST_DIR}/../kgui_edge.c ${CMAKE_CURRENT_LIST_DIR}/../kgui_fluid.c ${KGUI_SCREENS}"
          )
          s = s.replace(
              "INCLUDES ${CMAKE_CURRENT_LIST_DIR}/../screens)",
              "INCLUDES ${CMAKE_CURRENT_LIST_DIR}/../screens ${CMAKE_CURRENT_LIST_DIR}/.. ${CMAKE_CURRENT_LIST_DIR}/../include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kode_sys/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kdefs/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/klog/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kdrv/apps/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kaos/core/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/kqp/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/qpc/qpc/include ${CMAKE_CURRENT_LIST_DIR}/../../../sdk/components/qpc/port ${CMAKE_CURRENT_LIST_DIR}/../../../../../kds-freertos-headers)"
          )
          p.write_text(s)
          PY
          # KGUI screen headers include KodeOS QP/C declarations. The Windows
          # visual simulator does not run QP/FreeRTOS; provide type-only
          # FreeRTOS declarations so those headers parse without pretending
          # that an RTOS is running.
          mkdir -p kds-freertos-headers/freertos
          cat > kds-freertos-headers/freertos/FreeRTOS.h <<'EOF'
          #pragma once
          #include <stdint.h>
          #include <stddef.h>
          typedef void * QueueHandle_t;
          typedef void * TaskHandle_t;
          typedef int BaseType_t;
          typedef unsigned UBaseType_t;
          typedef uint32_t TickType_t;
          typedef uint32_t StackType_t;
          typedef struct { unsigned char opaque[128]; } StaticQueue_t;
          typedef struct { unsigned char opaque[256]; } StaticTask_t;
          typedef struct { unsigned opaque[8]; } portMUX_TYPE;
          #define configUSE_IDLE_HOOK 0
          #define configUSE_TICK_HOOK 0
          #define configCHECK_FOR_STACK_OVERFLOW 0
          #define configSUPPORT_STATIC_ALLOCATION 0
          #define tskIDLE_PRIORITY 0
          EOF
          cat > kds-freertos-headers/freertos/task.h <<'EOF'
          #pragma once
          #include "FreeRTOS.h"
          #define taskDISABLE_INTERRUPTS() ((void)0)
          #define taskENABLE_INTERRUPTS() ((void)0)
          #define taskENTER_CRITICAL(mux) ((void)(mux))
          #define taskEXIT_CRITICAL(mux) ((void)(mux))
          #define taskENTER_CRITICAL_FROM_ISR() (0U)
          #define taskEXIT_CRITICAL_FROM_ISR(x) ((void)(x))
          static inline void vTaskSuspendAll(void) {}
          static inline BaseType_t xTaskResumeAll(void) { return 1; }
          EOF
          cat > kds-freertos-headers/freertos/queue.h <<'EOF'
          #pragma once
          #include "FreeRTOS.h"
          EOF
          # MinGW's Windows CRT does not expose POSIX setenv(); provide a tiny
          # compatibility shim without changing the official SDK source.
          cat > kds-win-compat.h <<'EOF'
          #include <stdlib.h>
          #ifdef _WIN32
          static inline int kds_setenv(const char *name, const char *value, int overwrite)
          {
              if (!overwrite && getenv(name) != NULL) return 0;
              return _putenv_s(name, value);
          }
          #define setenv kds_setenv
          #endif
          EOF
          cmake -S upstream/KodeOS/components/kgui/sim -B build-kgui -G Ninja \
            -DCMAKE_C_FLAGS="-include $GITHUB_WORKSPACE/kds-win-compat.h"
          cmake --build build-kgui --parallel

      - name: Smoke-test real KGUI screen rendering
        shell: msys2 {0}
        run: |
          set -euo pipefail
          ./build-kgui/kgui_sim.exe face --snapshot kds-face.png --device --bezel
          test -s kds-face.png

      - name: Package Windows KGUI simulator
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p kds-kgui-windows
          cp build-kgui/kgui_sim.exe kds-kgui-windows/
          cp /ucrt64/bin/SDL2.dll kds-kgui-windows/
          cp kds-face.png kds-kgui-windows/
          cat > kds-kgui-windows/README.txt <<'EOF'
          Kds — real KodeOS KGUI preview for Windows.
          This executable builds the official KGUI screen sources with LVGL and SDL2.
          It is a fast native UI simulator, not a full ESP32-P4 firmware emulator.
          Run kgui_sim.exe face, launcher, loading, settings or touch_test.
          EOF

      - name: Upload Windows KGUI preview
        uses: actions/upload-artifact@v4
        with:
          name: kds-kgui-windows-preview
          path: kds-kgui-windows/
          if-no-files-found: error
          retention-days: 14
