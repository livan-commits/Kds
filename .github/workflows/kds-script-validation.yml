name: Kds firmware script validation

on:
  pull_request:
    paths:
      - "scripts/kds-firmware-wsl.sh"
      - "docs/APP-TESTING.md"
      - "README.md"
      - ".github/workflows/kds-script-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Bash syntax
        run: bash -n scripts/kds-firmware-wsl.sh
      - name: Check the KEMU-aware install path
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'install-app <ESP-IDF-project-directory>' scripts/kds-firmware-wsl.sh
          grep -Fq 'kode-sim" install --mailbox "$project"' scripts/kds-firmware-wsl.sh
          grep -Fq 'docs/APP-TESTING.md' README.md
          grep -Fq 'idf.py build' docs/APP-TESTING.md
          echo "KEMU-aware source build/install path is present."
